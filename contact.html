<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact | Shreya Punjabi</title>

  <meta
    name="description"
    content="Get in touch with Shreya Punjabi about architectural visualization and interior rendering projects."
  />

  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <header id="site-header" class="site-header"></header>

  <main class="container contact-page">
    <section class="page-intro">
      <p class="eyebrow">Contact</p>
      <h1>Let’s work together</h1>

      <p class="intro-text">
        Have an interior or architectural project in mind?
        Tell me a little about the space, the images you need,
        and your timeline.
      </p>
    </section>

    <form
      class="contact-form"
      action="https://formspree.io/f/xjkrqgev"
      method="POST"
    >
      <div class="contact-field">
        <label for="contact-name">Name *</label>
        <input
          type="text"
          id="contact-name"
          name="name"
          autocomplete="name"
          required
        />
      </div>

      <div class="contact-field">
        <label for="contact-email">Email *</label>
        <input
          type="email"
          id="contact-email"
          name="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="contact-field">
        <label for="contact-company">Company / Studio</label>
        <input
          type="text"
          id="contact-company"
          name="company"
          autocomplete="organization"
        />
      </div>

      <div class="contact-field">
        <label for="contact-message">About your project *</label>
        <textarea
          id="contact-message"
          name="message"
          rows="7"
          placeholder="Project details, number of renders, timeline, and any references you’d like to share..."
          required
        ></textarea>
      </div>

      <p class="contact-note">* Required fields</p>

      <button type="submit" class="contact-submit">
        Send message
      </button>
    </form>
  </main>
</body>
</html>
